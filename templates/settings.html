{% extends "base.html" %}
{% block content %}
<section class="panel">
  <p class="eyebrow">Settings</p>
  <h1>{{ t('settings') }}</h1>
  <p class="long-copy">Interface preferences and account options.</p>
  <div class="cards">
    <article class="card">
      <h3>Language</h3>
      <form method="post" action="/set-language" class="btn-row">
        <button class="btn" name="language" value="en">English</button>
        <button class="btn btn-secondary" name="language" value="fr">French</button>
      </form>
    </article>
    <article class="card">
      <h3>Discord</h3>
      <p>Discord is the sign-in identity used by Horizon Portal.</p>
      <a class="btn gold-shimmer" href="/api/auth/discord/start?mode=web">Reconnect Discord</a>
    </article>
    <article class="card">
      <h3>Appearance</h3>
      <p>Horizon Dark is currently the default theme.</p>
    </article>
  </div>
</section>
{% endblock %}
