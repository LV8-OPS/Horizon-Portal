{% extends "base.html" %}

{% block content %}
<section class="panel form-panel">
    <p class="eyebrow">Horizon Portal</p>
    <h1>{{ t('login') }}</h1>
    <p>Horizon Portal sign-in uses your Discord account.</p>

    <div class="hero-actions">
        <a class="btn gold-shimmer" href="/api/auth/discord/start?mode=web">

    <p class="muted">Your Horizon account is created automatically the first time you sign in with Discord.</p>
</section>
{% endblock %}
