{% extends "base.html" %}

{% block content %}
<section class="panel form-panel">
    <p class="eyebrow">Horizon Portal</p>
    <h1>{{ t('register') }}</h1>
    <p>There is no separate account registration. Horizon Portal uses Discord as its sign-in identity.</p>

    <div class="hero-actions">
        <a class="btn gold-shimmer" href="/api/auth/discord/start?mode=web">
            Create my account with Discord
        </a>
    </div>

    <p class="muted">Your Horizon account is created automatically on your first sign-in.</p>
</section>
{% endblock %}
